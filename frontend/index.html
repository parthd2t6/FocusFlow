<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <meta content="web_blank" name="shell-type" />

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>

  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-tint": "#545f73",
            "surface": "#faf8ff",
            "surface-container-highest": "#dae2fd",
            "inverse-primary": "#bcc7de",
            "on-tertiary": "#ffffff",
            "tertiary-fixed": "#fadfb8",
            "on-primary-fixed": "#111c2d",
            "primary-fixed": "#d8e3fb",
            "on-error-container": "#93000a",
            "on-primary-fixed-variant": "#3c475a",
            "surface-container-high": "#e2e7ff",
            "outline": "#75777d",
            "error": "#ba1a1a",
            "on-secondary-fixed": "#00174b",
            "on-primary-container": "#8590a6",
            "tertiary-fixed-dim": "#ddc39d",
            "on-error": "#ffffff",
            "surface-bright": "#faf8ff",
            "primary-fixed-dim": "#bcc7de",
            "inverse-on-surface": "#eef0ff",
            "surface-dim": "#d2d9f4",
            "on-surface-variant": "#45474c",
            "secondary-fixed": "#dbe1ff",
            "secondary-fixed-dim": "#b4c5ff",
            "secondary": "#0051d5",
            "tertiary": "#1e1200",
            "surface-container": "#eaedff",
            "primary": "#091426",
            "surface-container-lowest": "#ffffff",
            "on-tertiary-container": "#a38c6a",
            "inverse-surface": "#283044",
            "tertiary-container": "#35260c",
            "on-secondary": "#ffffff",
            "secondary-container": "#316bf3",
            "outline-variant": "#c5c6cd",
            "on-background": "#131b2e",
            "on-secondary-container": "#fefcff",
            "on-secondary-fixed-variant": "#003ea8",
            "on-surface": "#131b2e",
            "background": "#faf8ff",
            "on-tertiary-fixed-variant": "#564427",
            "surface-variant": "#dae2fd",
            "surface-container-low": "#f2f3ff",
            "on-primary": "#ffffff",
            "primary-container": "#1e293b",
            "on-tertiary-fixed": "#271902",
            "error-container": "#ffdad6"
          },

          borderRadius: {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem"
          },

          spacing: {
            "margin": "1rem",
            "gutter-lg": "1.5rem",
            "gutter": "1rem",
            "space-md": "0.75rem",
            "space-xs": "0.25rem",
            "space-sm": "0.5rem",
            "space-lg": "1rem",
            "space-2xl": "2rem",
            "space-xl": "1.5rem",
            "margin-lg": "2rem",
            "margin-md": "1.5rem"
          },

          fontFamily: {
            "label-sm": ["Inter"],
            "body-md": ["Inter"],
            "headline-lg": ["Inter"],
            "body-sm": ["Inter"],
            "display-lg": ["Inter"],
            "body-lg": ["Inter"],
            "label-md": ["Inter"],
            "display-lg-mobile": ["Inter"],
            "headline-sm": ["Inter"],
            "headline-md": ["Inter"],
            "code-sm": ["JetBrains Mono"]
          },

          fontSize: {
            "label-sm": ["11px", {
              lineHeight: "16px",
              letterSpacing: "0.03em",
              fontWeight: "600"
            }],
            "body-md": ["14px", {
              lineHeight: "20px",
              letterSpacing: "0em",
              fontWeight: "400"
            }],
            "headline-lg": ["24px", {
              lineHeight: "32px",
              letterSpacing: "-0.015em",
              fontWeight: "600"
            }],
            "body-sm": ["12px", {
              lineHeight: "16px",
              letterSpacing: "0em",
              fontWeight: "400"
            }],
            "display-lg": ["36px", {
              lineHeight: "44px",
              letterSpacing: "-0.02em",
              fontWeight: "600"
            }],
            "body-lg": ["16px", {
              lineHeight: "24px",
              letterSpacing: "-0.005em",
              fontWeight: "400"
            }],
            "label-md": ["13px", {
              lineHeight: "18px",
              letterSpacing: "0.01em",
              fontWeight: "500"
            }],
            "display-lg-mobile": ["28px", {
              lineHeight: "36px",
              letterSpacing: "-0.015em",
              fontWeight: "600"
            }],
            "headline-sm": ["16px", {
              lineHeight: "24px",
              letterSpacing: "-0.005em",
              fontWeight: "600"
            }],
            "headline-md": ["20px", {
              lineHeight: "28px",
              letterSpacing: "-0.01em",
              fontWeight: "600"
            }],
            "code-sm": ["12px", {
              lineHeight: "16px",
              letterSpacing: "0em",
              fontWeight: "400"
            }]
          }
        }
      }
    };
  </script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      overscroll-behavior: none;
    }

    main > :first-child {
      margin-top: 0 !important;
    }

    main > :last-child {
      margin-bottom: 0 !important;
    }

    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>

<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen">

  <main class="w-full min-h-screen flex flex-col justify-center items-center p-space-lg">
    <div class="flex flex-col w-full items-center justify-center py-space-xl px-space-md sm:px-space-xl">

      <div class="w-full max-w-[416px] bg-surface-container-lowest rounded-xl shadow-sm p-6 sm:p-8">

        <!-- Branding -->
        <div class="flex flex-col items-center text-center mb-space-xl">
          <div class="flex items-center gap-space-xs mb-space-md">
            <div class="w-6 h-6 rounded-lg bg-primary-container flex items-center justify-center text-on-primary">
              <span
                class="material-symbols-outlined text-[16px] leading-none"
                style="font-variation-settings: 'FILL' 1;"
              >adjust</span>
            </div>

            <span class="font-headline-sm text-headline-sm text-primary tracking-tight">
              FocusFlow
            </span>
          </div>

          <h1 class="font-headline-md text-headline-md text-primary mb-1">
            Sign in to your account
          </h1>

          <p class="font-body-md text-body-md text-on-surface-variant">
            Welcome back. Enter your credentials to access your flow.
          </p>
        </div>

        <!-- Login form -->
        <form
          action="/api/v1/auth/login"
          class="flex flex-col gap-space-lg"
          id="login-form"
          method="POST"
          novalidate
        >

          <div
            aria-live="polite"
            class="hidden rounded-lg p-space-sm font-body-sm text-body-sm"
            id="auth-feedback"
            role="alert"
          ></div>

          <!-- Email -->
          <div class="flex flex-col gap-1.5">
            <label class="font-label-md text-label-md text-primary" for="email">
              Email address
            </label>

            <input
              autocomplete="email"
              class="w-full px-3.5 py-2.5 font-body-md text-body-md text-on-surface bg-surface-container-lowest rounded-lg border border-outline-variant focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition placeholder:text-outline"
              id="email"
              name="email"
              placeholder="name@example.com"
              required
              type="email"
            />

            <span
              class="hidden font-body-sm text-body-sm text-error"
              id="email-error"
            >Please enter a valid email address.</span>
          </div>

          <!-- Password -->
          <div class="flex flex-col gap-1.5">
            <label class="font-label-md text-label-md text-primary" for="password">
              Password
            </label>

            <div class="relative flex items-center">
              <input
                autocomplete="current-password"
                class="w-full px-3.5 py-2.5 font-body-md text-body-md text-on-surface bg-surface-container-lowest rounded-lg border border-outline-variant pr-10 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition placeholder:text-outline"
                id="password"
                name="password"
                placeholder="••••••••"
                required
                type="password"
              />

              <button
                aria-controls="password"
                aria-label="Show password"
                class="absolute right-0 top-0 bottom-0 px-3 flex items-center justify-center text-outline hover:text-primary transition rounded-r-lg focus:outline-none focus:ring-2 focus:ring-primary"
                id="toggle-password"
                type="button"
              >
                <span
                  class="material-symbols-outlined text-[20px] select-none"
                  id="eye-icon"
                >visibility</span>
              </button>
            </div>

            <span
              class="hidden font-body-sm text-body-sm text-error"
              id="password-error"
            >Password is required.</span>
          </div>

          <!-- Remember me: separate row -->
          <div class="flex items-center justify-start pt-0.5">
            <label class="flex items-center gap-2 cursor-pointer select-none">
              <input
                class="w-4 h-4 rounded text-primary focus:ring-primary border-outline-variant transition cursor-pointer accent-primary"
                id="remember-me"
                name="remember_me"
                type="checkbox"
              />

              <span class="font-body-md text-body-md text-on-surface-variant">
                Remember me
              </span>
            </label>
          </div>

          <!-- Full-width Sign In button -->
          <button
            class="w-full h-11 px-4 bg-primary-container hover:bg-primary active:bg-primary text-on-primary font-label-md text-label-md rounded-lg transition shadow-sm flex items-center justify-center gap-2 cursor-pointer focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary"
            id="submit-btn"
            type="submit"
          >
            <span id="btn-text">Sign in</span>

            <span
              class="hidden w-4 h-4 rounded-full border-2 border-white/20 border-t-white animate-spin"
              id="btn-spinner"
            ></span>
          </button>

        </form>

        <!-- Link to signup -->
        <div class="mt-6 text-center">
          <p class="font-body-md text-body-md text-on-surface-variant">
            Don't have an account?

            <a
              class="font-label-md text-label-md text-primary hover:underline ml-1"
              href="http://127.0.0.1:5500/signup.html"
            >Sign up</a>
          </p>
        </div>

      </div>

      <!-- Footer -->
      <div class="mt-space-lg flex items-center gap-space-md text-center">
        <span class="font-body-sm text-body-sm text-outline flex items-center gap-1">
          <span class="material-symbols-outlined text-[14px]">lock</span>
          256-bit encrypted authentication
        </span>
      </div>

    </div>
  </main>

  <script>
    (function () {
      const passwordInput = document.getElementById('password');
      const togglePasswordBtn = document.getElementById('toggle-password');
      const eyeIcon = document.getElementById('eye-icon');

      const form = document.getElementById('login-form');
      const emailInput = document.getElementById('email');
      const emailError = document.getElementById('email-error');
      const passwordError = document.getElementById('password-error');
      const feedbackBox = document.getElementById('auth-feedback');

      const submitBtn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');
      const btnSpinner = document.getElementById('btn-spinner');

      // Show or hide the password
      if (togglePasswordBtn && passwordInput && eyeIcon) {
        togglePasswordBtn.addEventListener('click', function (event) {
          event.preventDefault();

          const isPassword =
            passwordInput.getAttribute('type') === 'password';

          passwordInput.setAttribute(
            'type',
            isPassword ? 'text' : 'password'
          );

          togglePasswordBtn.setAttribute(
            'aria-label',
            isPassword ? 'Hide password' : 'Show password'
          );

          eyeIcon.textContent =
            isPassword ? 'visibility_off' : 'visibility';
        });
      }

      if (form) {
        form.addEventListener('submit', async function (event) {
          event.preventDefault();

          let isValid = true;

          const emailValue = emailInput.value.trim();
          const passwordValue = passwordInput.value;

          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

          // Validate email
          if (!emailValue || !emailRegex.test(emailValue)) {
            emailError.classList.remove('hidden');
            emailInput.classList.add('border-error');
            isValid = false;
          } else {
            emailError.classList.add('hidden');
            emailInput.classList.remove('border-error');
          }

          // Validate password
          if (!passwordValue) {
            passwordError.classList.remove('hidden');
            passwordInput.classList.add('border-error');
            isValid = false;
          } else {
            passwordError.classList.add('hidden');
            passwordInput.classList.remove('border-error');
          }

          if (!isValid) {
            return;
          }

          // Show loading state
          btnText.textContent = 'Signing in...';
          btnSpinner.classList.remove('hidden');

          submitBtn.setAttribute('disabled', 'true');
          submitBtn.classList.add('opacity-80', 'cursor-not-allowed');

          feedbackBox.classList.add('hidden');

          try {
            const response = await fetch(
              'http://127.0.0.1:8000/api/v1/auth/login',
              {
                method: 'POST',
                credentials: 'include',
                headers: {
                  'Content-Type': 'application/json',
                  'Accept': 'application/json'
                },
                body: JSON.stringify({
                  email: emailValue,
                  password: passwordValue
                })
              }
            );

            const data = await response.json().catch(() => ({}));

            if (response.ok) {
              // Verify the login session before redirecting.
              const sessionResponse = await fetch(
                'http://127.0.0.1:8000/api/v1/auth/me',
                {
                  method: 'GET',
                  credentials: 'include',
                  headers: {
                    'Accept': 'application/json'
                  }
                }
              );

              if (sessionResponse.ok) {
                feedbackBox.textContent =
                  'Login successful. Redirecting to your dashboard...';

                feedbackBox.className =
                  'rounded-lg p-space-sm font-body-sm text-body-sm bg-surface-container text-on-surface block';

                window.location.replace(
                  'http://127.0.0.1:5500/dashboard.html'
                );

                return;
              }

              feedbackBox.textContent =
                'Your credentials were accepted, but your login session could not be verified. Please try again.';

              feedbackBox.className =
                'rounded-lg p-space-sm font-body-sm text-body-sm bg-error-container text-on-error-container block';

            } else {
              const message = typeof data.detail === 'string'
                ? data.detail
                : 'Invalid email or password. Please try again.';

              feedbackBox.textContent = message;

              feedbackBox.className =
                'rounded-lg p-space-sm font-body-sm text-body-sm bg-error-container text-on-error-container block';
            }

          } catch (error) {
            console.error('Login error:', error);

            feedbackBox.textContent =
              'Connection error. Please verify that the backend server is running.';

            feedbackBox.className =
              'rounded-lg p-space-sm font-body-sm text-body-sm bg-error-container text-on-error-container block';

          } finally {
            btnText.textContent = 'Sign in';
            btnSpinner.classList.add('hidden');

            submitBtn.removeAttribute('disabled');
            submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
          }
        });

        // Clear email validation error when the user edits the field
        emailInput.addEventListener('input', () => {
          if (!emailError.classList.contains('hidden')) {
            emailError.classList.add('hidden');
            emailInput.classList.remove('border-error');
          }
        });

        // Clear password validation error when the user edits the field
        passwordInput.addEventListener('input', () => {
          if (!passwordError.classList.contains('hidden')) {
            passwordError.classList.add('hidden');
            passwordInput.classList.remove('border-error');
          }
        });
      }
    })();
  </script>

</body>
</html>
